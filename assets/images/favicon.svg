<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="100%" height="100%">
  <defs>
    <linearGradient id="favGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="favDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
  </defs>

  <!-- Circular Shield -->
  <circle cx="54" cy="54" r="52" fill="url(#favDark)" />
  <circle cx="54" cy="54" r="48" fill="none" stroke="url(#favGold)" stroke-width="2.5" opacity="0.95" />
  
  <!-- DNA Helix Accent -->
  <path d="M 34 32 Q 54 48 74 32 Q 54 16 34 32" fill="none" stroke="url(#favGold)" stroke-width="2.5" opacity="0.8"/>
  <path d="M 34 76 Q 54 60 74 76 Q 54 92 34 76" fill="none" stroke="url(#favGold)" stroke-width="2.5" opacity="0.8"/>
  
  <!-- Connection Dots -->
  <circle cx="38" cy="35" r="3" fill="#fbbf24" />
  <circle cx="70" cy="35" r="3" fill="#34d399" />
  <circle cx="38" cy="73" r="3" fill="#34d399" />
  <circle cx="70" cy="73" r="3" fill="#fbbf24" />

  <!-- Sprouting Leaves / Seed Motif -->
  <path d="M 54 86 C 52 70 32 56 30 38 C 48 41 56 58 54 86 Z" fill="url(#favGreen)"/>
  <path d="M 54 86 C 56 70 76 56 78 38 C 60 41 52 58 54 86 Z" fill="url(#favGold)"/>
  <path d="M 54 86 L 54 26" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Sun / Seed Crown -->
  <circle cx="54" cy="23" r="6" fill="#fef08a" />
</svg>