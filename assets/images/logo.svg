<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 125" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="emeraldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#059669" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Logo Mark Graphic -->
  <g transform="translate(10, 8)">
    <!-- Circular Shield Background -->
    <circle cx="54" cy="54" r="52" fill="url(#emeraldDark)" />
    <circle cx="54" cy="54" r="48" fill="none" stroke="url(#goldenGlow)" stroke-width="2" opacity="0.9" />
    
    <!-- DNA Genetics Helix Accent -->
    <path d="M 34 32 Q 54 48 74 32 Q 54 16 34 32" fill="none" stroke="url(#goldenGlow)" stroke-width="2.5" opacity="0.75"/>
    <path d="M 34 76 Q 54 60 74 76 Q 54 92 34 76" fill="none" stroke="url(#goldenGlow)" stroke-width="2.5" opacity="0.75"/>
    
    <!-- Connection Dots -->
    <circle cx="38" cy="35" r="2.8" fill="#fbbf24" />
    <circle cx="70" cy="35" r="2.8" fill="#34d399" />
    <circle cx="38" cy="73" r="2.8" fill="#34d399" />
    <circle cx="70" cy="73" r="2.8" fill="#fbbf24" />

    <!-- Sprouting Leaves / Seed Motif -->
    <path d="M 54 86 C 52 70 32 56 30 38 C 48 41 56 58 54 86 Z" fill="url(#primaryGreen)" filter="url(#softGlow)"/>
    <path d="M 54 86 C 56 70 76 56 78 38 C 60 41 52 58 54 86 Z" fill="url(#goldenGlow)" />
    <path d="M 54 86 L 54 26" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    
    <!-- Sun / Seed Crown -->
    <circle cx="54" cy="23" r="5.5" fill="#fef08a" />
  </g>

  <!-- Typography Text -->
  <g transform="translate(132, 14)">
    <!-- GANGA AGRI -->
    <text x="0" y="44" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="1" fill="#064e3b">
      GANGA <tspan fill="#059669">AGRI</tspan>
    </text>
    
    <!-- GENETICS -->
    <text x="2" y="78" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="7" fill="#d97706">
      GENETICS
    </text>
    
    <!-- Tagline -->
    <text x="3" y="98" font-family="'Inter', -apple-system, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#475569">
      HIGH-YIELDING HYBRID SEEDS &amp; R&amp;D
    </text>
  </g>
</svg>
