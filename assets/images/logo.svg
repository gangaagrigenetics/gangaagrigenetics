<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="emeraldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#059669" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Logo Mark Graphic -->
  <g transform="translate(10, 10)">
    <!-- Circular Shield Background -->
    <circle cx="50" cy="50" r="48" fill="url(#emeraldDark)" />
    <circle cx="50" cy="50" r="45" fill="none" stroke="url(#goldenGlow)" stroke-width="1.8" opacity="0.85" />
    
    <!-- DNA Genetics Helix Accent -->
    <path d="M 32 30 Q 50 45 68 30 Q 50 15 32 30" fill="none" stroke="url(#goldenGlow)" stroke-width="2" opacity="0.6"/>
    <path d="M 32 70 Q 50 55 68 70 Q 50 85 32 70" fill="none" stroke="url(#goldenGlow)" stroke-width="2" opacity="0.6"/>
    
    <!-- Connection Dots -->
    <circle cx="36" cy="33" r="2.2" fill="#fbbf24" />
    <circle cx="64" cy="33" r="2.2" fill="#34d399" />
    <circle cx="36" cy="67" r="2.2" fill="#34d399" />
    <circle cx="64" cy="67" r="2.2" fill="#fbbf24" />

    <!-- Sprouting Leaves / Seed Motif -->
    <path d="M 50 80 C 48 65 30 52 28 35 C 44 38 52 54 50 80 Z" fill="url(#primaryGreen)" filter="url(#softGlow)"/>
    <path d="M 50 80 C 52 65 70 52 72 35 C 56 38 48 54 50 80 Z" fill="url(#goldenGlow)" />
    <path d="M 50 80 L 50 24" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Sun / Seed Crown -->
    <circle cx="50" cy="22" r="4.5" fill="#fef08a" />
  </g>

  <!-- Typography Text -->
  <g transform="translate(125, 20)">
    <!-- GANGA AGRI -->
    <text x="0" y="38" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="1.5" fill="#064e3b">
      GANGA <tspan fill="#059669">AGRI</tspan>
    </text>
    
    <!-- GENETICS -->
    <text x="2" y="68" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="6" fill="#d97706">
      GENETICS
    </text>
    
    <!-- Tagline -->
    <text x="3" y="85" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2" fill="#475569">
      HYBRID SEEDS &amp; AGRICULTURAL INNOVATION
    </text>
  </g>
</svg>
